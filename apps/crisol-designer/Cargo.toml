[package]
name = "crisol-designer"
description = "Crisol, the visual form designer for Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "crisol"
path = "src/main.rs"

[dependencies]
crisol-model.workspace = true
crisol-catalog.workspace = true
crisol-commands.workspace = true
crisol-engine.workspace = true
crisol-codegen.workspace = true
crisol-ui.workspace = true
crisol-render.workspace = true
gpui.workspace = true
gpui_platform.workspace = true

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_wgpu.workspace = true
image.workspace = true

[lints]
workspace = true
